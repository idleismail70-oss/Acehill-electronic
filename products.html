<!DOCTYPE html>
<html lang="en-KE">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Electronics for Sale in Garissa &amp; Nairobi | Ace Hill</title>
  <meta name="description" content="Shop CCTV cameras, phones, laptops and accessories at Ace Hill Electronics in Garissa and Nairobi.">
  <link rel="canonical" href="https://acehillonlinemarket.co.ke/products.html">
  <link rel="icon" href="/images/favicon.svg" type="image/svg+xml">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Plus+Jakarta+Sans:wght@700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css?v=13">
</head>
<body data-page="products">
  <div id="site-header"></div>
  <main id="main" class="section" style="padding-top:28px">
    <div class="wrap">
      <div class="page-hero">
        <h1>Products for sale in Garissa and Nairobi</h1>
        <p class="muted">Search CCTV cameras, phones, laptops and accessories. Collect from Garissa or Nairobi.</p>
      </div>
      <div style="margin:18px 0 8px">
        <input class="text-input" id="catalog-search" type="search" placeholder="Search products…" aria-label="Search products">
      </div>
      <div class="chips" id="category-chips"></div>
      <div class="toolbar">
        <div>
          <button class="btn btn-outline filter-toggle" id="filter-toggle" type="button">Filters</button>
          <strong id="result-count">0 products</strong>
        </div>
        <label style="max-width:240px">
          <span class="muted">Sort by</span>
          <select id="sort">
            <option value="featured">Featured</option>
            <option value="newest">Newest</option>
            <option value="price-asc">Price: Low to High</option>
            <option value="price-desc">Price: High to Low</option>
            <option value="az">A → Z</option>
          </select>
        </label>
      </div>
      <div class="catalog-layout">
        <aside class="panel filters" id="filters">
          <h3>Brand</h3>
          <div id="brand-filters"></div>
          <h3>Price</h3>
          <div class="range-row"><span id="price-label">KES 0 – KES 200,000</span></div>
          <input type="range" id="price-max" min="0" max="200000" step="500" value="200000">
          <h3>Availability</h3>
          <select id="availability">
            <option value="All">All</option>
            <option value="In Stock">In Stock</option>
            <option value="Out of Stock">Out of Stock</option>
            <option value="Pre-order">Pre-order</option>
          </select>
        </aside>
        <div class="product-grid" id="product-grid"></div>
      </div>
    </div>
  </main>
  <div id="site-footer"></div>
  <script src="/js/config.js?v=8"></script>
  <script src="/js/app.js?v=8"></script>
</body>
</html>
